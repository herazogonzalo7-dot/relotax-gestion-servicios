<!DOCTYPE html> <!--Se indica que el documento es HTML5 y se configura el idioma en español-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de Nuevo Abonado - Relotax S.R.L.</title>
    <!-- Se importa Bootstrap (para aplicar estilos modernos y responsivos)-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!--Contenedor principal-->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!--Tarjeta de Bootstrap que contiene el formulario-->
                <div class="card shadow">
                    <!--Cabecera-->
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">HU01: Alta de Nuevo Abonado</h4>
                    </div>
                    <div class="card-body">
                        
                        <!--Sección que muestra el mensaje de carga exitosa (enviado desde views.py)-->
                        {% if messages %}
                            <div class="mb-3">
                                {% for message in messages %}
                                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                        
                        <!--La etiqueta form es la etiqueta del formulario, todo lo que contiene adentro es información que el usuario va a completar, y cuando esté lista, se empaquetará y enviará usando el método POST-->
                        <form method="POST">
                            <!--Medida de seguridad para que no se puedan enviar datos desde otra página web-->
                            {% csrf_token %}
                            <!--Acá se recibe la variable formulario mediante su etiqueta form, gracias a as_p se evita tener que escribir cada caja de texto a mano-->
                            {{ form.as_p }}
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">Guardar Abonado</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Se importa el script de Bootstrap JS para que funcionen las alertas-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
